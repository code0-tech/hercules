[package]
name = "hercules-sdk"
description = "Rust SDK for the hercules action runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hercules-macros = { path = "../hercules-macros", version = "0.0.0" }
tucana.workspace = true
tokio.workspace = true
tonic.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio-stream.workspace = true
log.workspace = true
inventory.workspace = true
uuid.workspace = true
jsonwebtoken.workspace = true

# Apus data-plane transport (feature `apus`), kept out of the default build:
# a direct action<->Taurus connection (see ../../../apus/protocol/SPEC-v1.md)
# that replaces hercules's own gRPC data plane while Aquila's gRPC control
# plane stays as-is. Path dependency on the sibling `apus` repository.
apus-client = { path = "../../../apus/rust/apus-client", optional = true }

[features]
default = []
apus = ["dep:apus-client"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
