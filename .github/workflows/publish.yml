name: Publish packages

on:
  push:
    tags:
      - '*'

jobs:
  npm:
    runs-on: ubuntu-latest

    environment: packages

    permissions:
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: ts

    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '25.9.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Set version
        run: npm version ${{ github.ref_name }} --git-tag-version=false
      - name: Compile files
        run: npm run build
      - name: Run tests
        run: npm run test
      - name: Publish package
        run: npm publish

  pypi:
    runs-on: ubuntu-latest

    environment: packages

    permissions:
      # Required for PyPI trusted publishing (OIDC); no API token needed.
      id-token: write

    defaults:
      run:
        shell: bash
        working-directory: py

    env:
      # code0-definition release the built-in definitions are generated from.
      DEFINITIONS_VERSION: ${{ vars.HERCULES_DEFINITIONS_VERSION || 'def-0.0.35' }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Set up Node
        # Node powers the Pydantic <-> TypeScript schema conversion (hercules/_tsgen).
        uses: actions/setup-node@v6
        with:
          node-version: '25.9.x'
      - name: Install dependencies
        run: uv sync
      - name: Install Node helper dependencies
        run: npm ci --prefix hercules/_tsgen
      - name: Set version
        # The git tag (minus any leading "v") becomes the package version.
        run: uv version "${GITHUB_REF_NAME#v}"
      - name: Generate definitions
        run: uv run python scripts/build_definitions.py --version "$DEFINITIONS_VERSION"
      - name: Run tests
        run: uv run pytest
      - name: Build package
        run: uv build
      - name: Publish package
        run: uv publish --trusted-publishing always

  cargo:
    runs-on: ubuntu-latest

    environment: packages

    defaults:
      run:
        shell: bash
        working-directory: rust

    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Set version
        # The git tag (minus any leading "v") becomes the version of every
        # workspace crate, including the pinned hercules-macros dependency.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \"0.0.0\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "s/hercules-macros = { path = \"..\/hercules-macros\", version = \"0.0.0\" }/hercules-macros = { path = \"..\/hercules-macros\", version = \"$VERSION\" }/" hercules/Cargo.toml
      - name: Run tests
        run: cargo test --workspace
      - name: Publish hercules-macros
        run: cargo publish -p hercules-macros --allow-dirty
      - name: Wait for crates.io index
        run: sleep 30
      - name: Publish hercules-sdk
        run: cargo publish -p hercules-sdk --allow-dirty
